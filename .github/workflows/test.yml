name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Chrome is preinstalled on the runner; the screenshot, kit and benchmark tests use it.
      - run: google-chrome --version
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
